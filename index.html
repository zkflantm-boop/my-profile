
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-family: Arial, sans-serif;
}
.card {
  background: white;
  padding: 40px;
  border-radius: 24px;
  width: 300px;
  max-width: 75vw;
  text-align: center;
  box-shadow: 0 15px 40px #0003;
}
.avatar {
  width: 120px;
  height: 120px;
  background: #ddd;
  border-radius: 50%;
  margin: auto;
  display: grid;
  place-items: center;
  font-size: 50px;
}
h1 {
  transition: 0.3s;
}
h1:hover {
  color: #764ba2;
}
.interest {
  background: #f3efff;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
}
</style>
</head>
<body>
<div class="card">
  <div class="avatar">👤</div>
  <h1>기계공학도</h1>
  <p>새로운 기술과 도전을 좋아하는 대학생입니다.</p>
  <h3>My Interests</h3>
  <div class="interest">🚗 자동차</div>
  <div class="interest">⚙️ 기계 설계</div>
  <div class="interest">💻 AI 코딩</div>
</div>
</body>
</html>
